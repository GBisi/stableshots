name: Full failover analysis

on:
  push:
    branches:
      - research/qpu-failover-stableshots
    paths:
      - ".github/workflows/qpu-failover-analysis.yml"
      - "experiments/analyze_failover_results.py"
      - "experiments/failover_config.json"
      - "results/qpu_failover/raw/**"
      - "results/qpu_failover/run_manifest.json"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: full-qpu-failover-analysis
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze full pushed failover dataset
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out research branch
        uses: actions/checkout@v4
        with:
          ref: research/qpu-failover-stableshots
          fetch-depth: 0

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install project
        run: uv sync --frozen

      - name: Configure Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Verify raw dataset exists
        run: |
          test -s results/qpu_failover/raw/single_failure_runs.csv
          test -s results/qpu_failover/raw/multi_failure_runs.csv
          test -s results/qpu_failover/raw/stochastic_failure_runs.csv
          test -s results/qpu_failover/raw/qpu_references.csv
          test -s results/qpu_failover/raw/no_failure_runs.csv
          test -s results/qpu_failover/raw/fixed_shot_runs.csv

      - name: Run full analysis and auto-publish results
        run: |
          uv run python experiments/analyze_failover_results.py \
            --config experiments/failover_config.json

      - name: Show published result tree
        run: |
          git pull --ff-only
          find results/qpu_failover/analysis -maxdepth 1 -type f -printf "%f %s bytes\n" | sort
          find results/qpu_failover/plots -type f -printf "%P %s bytes\n" | sort | head -100
