name: QPU handoff policy matrix

on:
  push:
    branches:
      - research/qpu-handoff-policy-matrix
    paths:
      - "experiments/handoff_policy_matrix_config.json"
      - "experiments/run_handoff_policy_matrix.py"
      - "experiments/analyze_handoff_policy_matrix.py"
      - ".github/workflows/qpu-handoff-policy-matrix.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: qpu-handoff-policy-matrix
  cancel-in-progress: true

jobs:
  experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 240

    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/qpu-handoff-policy-matrix
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - run: uv sync --frozen

      - name: Run policy matrix
        run: |
          uv run python experiments/run_handoff_policy_matrix.py             --config experiments/handoff_policy_matrix_config.json

      - name: Analyze policy matrix
        run: |
          uv run python experiments/analyze_handoff_policy_matrix.py             --config experiments/handoff_policy_matrix_config.json

      - name: Verify
        run: |
          uv run python - <<'PY'
          import pandas as pd

          root = "results/qpu_handoff_policy_matrix"
          nf = pd.read_csv(f"{root}/raw/no_failure_policy_runs.csv")
          h = pd.read_csv(f"{root}/raw/handoff_policy_runs.csv")
          e = pd.read_csv(f"{root}/analysis/selection_event_metrics.csv")

          assert len(nf) == 540, len(nf)
          assert len(h) == 21600, len(h)
          assert len(e) == 5400, len(e)
          assert set(h["policy_id"]) == {
              "stableshots_keep",
              "stableshots_discard",
              "fixed_10k_keep",
              "fixed_10k_discard",
              "fixed_20k_keep",
              "fixed_20k_discard",
          }
          assert e["candidate_targets"].eq(4).all()
          assert e["r_tvd"].ge(-1e-12).all()
          assert e["r_shots"].ge(-1e-9).all()
          assert h["final_tvd_to_aer"].between(0, 1).all()
          assert h["total_physical_shots"].gt(0).all()
          PY

      - name: Publish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/qpu_handoff_policy_matrix
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Add QPU handoff policy matrix results"
          git push origin HEAD:refs/heads/research/qpu-handoff-policy-matrix
