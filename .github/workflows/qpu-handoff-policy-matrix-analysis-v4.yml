name: QPU handoff policy matrix analysis v4

on:
  push:
    branches:
      - research/qpu-handoff-policy-matrix
    paths:
      - "experiments/handoff_policy_matrix_analysis_v4_config.json"
      - "experiments/analyze_handoff_policy_matrix_v4.py"
      - ".github/workflows/qpu-handoff-policy-matrix-analysis-v4.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: qpu-handoff-policy-matrix-analysis-v4
  cancel-in-progress: true

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/qpu-handoff-policy-matrix
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen
      - name: Run analysis v4
        run: |
          uv run python experiments/analyze_handoff_policy_matrix_v4.py             --config experiments/handoff_policy_matrix_analysis_v4_config.json
      - name: Verify
        run: |
          uv run python - <<'PY'
          import json
          import pandas as pd
          root = "results/qpu_handoff_policy_matrix/analysis_v4"
          m = json.load(open(f"{root}/analysis_v4_manifest.json"))
          assert m["excluded_stopping_rules"] == ["fixed_10k"]
          assert "capfree" not in m
          assert set(m["policies"]) == {
              "stableshots_keep",
              "stableshots_discard",
              "fixed_20k_keep",
              "fixed_20k_discard",
          }
          e = pd.read_csv(f"{root}/full/selection_event_metrics.csv")
          assert len(e) == 3000
          assert set(e["policy_id"]) == set(m["policies"])
          assert "fixed_10k" not in set(e["stopping_rule"])
          assert e["candidate_targets"].eq(4).all()
          d = pd.read_csv(f"{root}/full/proposal_destination_shot_comparison.csv")
          assert len(d) == 3000
          PY
      - name: Publish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add             results/qpu_handoff_policy_matrix/analysis_v4             results/qpu_handoff_policy_matrix/plots_v4
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Simplify policy analysis to StableShots and fixed 20k"
          git push origin HEAD:refs/heads/research/qpu-handoff-policy-matrix
