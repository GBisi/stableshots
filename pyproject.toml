[project]
name = "stableshot"
version = "0.2.0"
description = "Adaptive and auditable shot control for static quantum-circuit execution"
readme = "README.md"
authors = [
    { name = "GBisi", email = "giuseppe.bisicchia@phd.unipi.it" }
]
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.10.9",
    "pandas>=3.0.3",
    "qsimbench>=0.1.1",
]

[project.optional-dependencies]
demo = [
    "streamlit>=1.49,<2",
]

[project.scripts]
stableshot = "stableshot.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/stableshot"]
